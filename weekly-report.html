<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>填写本周周报 - 销售工作台</title><link rel="stylesheet" href="styles.css"></head>
<body><style>.weekly-input textarea{width:100%;min-height:76px;border:1px solid #e1e7f0;border-radius:6px;padding:8px;resize:vertical}.weekly-input input[type=file]{max-width:100%}.weekly-input td.group{vertical-align:middle}</style><main class="page"><div class="head"><div><h1>填写本周周报</h1><p>周五 14:30 · 当前填写人：<span id="person">王晓</span></p></div><div class="actions"><a class="btn" href="index.html">返回工作台</a><button class="btn primary" id="submit">提交周报</button></div></div>
<div class="panel"><div class="meta"><div><span>填写人</span><strong id="person2">王晓</strong></div><div><span>周报日期</span><input id="report-date" type="date" aria-label="选择周报日期"></div><div><span>填写方式</span><strong>按模板逐项填写</strong></div></div><form id="report"></form></div></main><div id="toast" class="toast hidden"></div>
<script>
const fields=[['本周CRM拜访打卡','上传CRM打卡截图','photo'],['销售业绩','本周合同签约'],['销售业绩','本周开票'],['销售业绩','本周回款'],['销售业绩','下周预计合同'],['销售业绩','下周预计回款'],['市场洞察','行业动态、友商信息'],['签管一体化专项','新增商机'],['签管一体化专项','存量商机重点进展'],['老客户续费进展','SA客户经营进展'],['老客户续费进展','腰部客户版本续费'],['老客户续费进展','其他客户续费进展'],['大流量客户','十万以上客户挖角进展'],['大流量客户','飓风行动客户进展'],['政府业务进展','统一印章、不动产公积金、政府信创'],['专精特新、水热煤电客户摸排进展','拜访覆盖数、新增商机数、存量商机关键进展'],['其他客户进展','新增客户沟通进展'],['其他客户进展','存量客户沟通及关键进展'],['区域伙伴进展','区域生态经营、人脉会、个人合伙人'],['区域伙伴进展','线下商机拓展活动（照片）','photo'],['下周重点工作计划','总体重点工作'],['下周重点工作计划','SA类老客户拜访计划（列明客户及拜访目的）'],['下周重点工作计划','专项客户拜访计划（列明客户及拜访目的）'],['销售业绩','下周预计开票']];
const form=document.querySelector('#report');form.innerHTML='<div class="table-wrap"><table class="full-report weekly-input"><thead><tr><th style="width:22%">事项</th><th style="width:32%">重点关注</th><th>本周填写内容</th></tr></thead><tbody>'+fields.map((x,i)=>`<tr><td class="group">${x[0]}</td><td>${x[1]}</td><td>${x[2]==='photo'?`<input type="file" name="f${i}" accept="image/*" multiple>`:`<textarea name="f${i}" placeholder="填写${x[1]}"></textarea>`}</td></tr>`).join('')+'</tbody></table></div><div class="form-foot"><button type="button" class="btn" id="draft">保存草稿</button><button class="btn primary" id="submit2">提交周报</button></div>';
const invoiceRow=form.querySelector('[name="f23"]').closest('tr');form.querySelector('tbody').insertBefore(invoiceRow,form.querySelector('[name="f6"]').closest('tr'));
let currentUser=''; const API=location.protocol==='http:'||location.protocol==='https:';
function defaultFriday(){const d=new Date();const offset=(5-d.getDay()+7)%7;d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function isFriday(value){return value&&new Date(`${value}T00:00:00`).getDay()===5}
function fileData(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,data:reader.result});reader.readAsDataURL(file)})}
async function formDataWithFiles(){const data={};for(const [key,value] of new FormData(form).entries()){if(value instanceof File){if(value.name)(data[key]||(data[key]=[])).push(await fileData(value))}else data[key]=value}return data}
async function init(){const date=document.querySelector('#report-date');date.value=defaultFriday();date.addEventListener('change',()=>{if(!isFriday(date.value)){alert('周报日期只能选择周五');date.value=defaultFriday()}});if(API){const me=await fetch('/api/me');if(!me.ok){location.href='index.html';return}const m=await me.json();currentUser=m.user.name;document.querySelector('#person').textContent=currentUser;document.querySelector('#person2').textContent=currentUser}}
async function save(submitted){const date=document.querySelector('#report-date').value;if(!isFriday(date)){alert('请选择周五作为周报日期');return}const data=await formDataWithFiles();if(API){const r=await fetch('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:currentUser,date,payload:data,submitted})});if(!r.ok){alert('周报保存失败，请重新登录后重试');return}}else{const db=JSON.parse(localStorage.getItem('sales-workbench-data')||'{"reports":{}}');db.reports=db.reports||{};db.reports[currentUser||'未登录']=Object.assign(data,{submitted,date});localStorage.setItem('sales-workbench-data',JSON.stringify(db))}const t=document.querySelector('#toast');t.textContent=submitted?'周报已提交':'草稿已保存';t.className='toast';setTimeout(()=>t.className='toast hidden',1600);if(submitted)setTimeout(()=>location.href='index.html#weekly-summary',500)}
document.querySelector('#submit').onclick=()=>save(true);document.querySelector('#submit2').onclick=()=>save(true);document.querySelector('#draft').onclick=()=>save(false);init();
</script></body></html>
